<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Production Content-Security-Policy. Keep it strict: nothing inline, nothing
      from another origin, and no string-to-HTML sinks (Trusted Types).
      The Vite dev server removes this tag (see vite.config.ts); production
      builds ship it unchanged. Details: docs/ARCHITECTURE.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'self';
        img-src 'self';
        font-src 'self';
        connect-src 'self';
        base-uri 'none';
        form-action 'self';
        require-trusted-types-for 'script';
        trusted-types 'none'
      "
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b051c" />
    <meta
      name="description"
      content="Zavolt is a password manager in early development, designed around zero-knowledge encryption. It is not available yet."
    />
    <title>Zavolt</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <noscript>
      <p class="noscript-message">
        Zavolt needs JavaScript to run. Enable JavaScript and reload this page.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
