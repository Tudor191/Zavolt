version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Do not propose a release until it has been public for a week. Most
    # malicious npm releases are discovered and removed within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Tooling moves together; one pull request per week is enough.
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Code that ships to users is updated one package at a time, so each
      # change can be reviewed on its own.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
